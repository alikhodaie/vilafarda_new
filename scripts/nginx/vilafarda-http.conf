# داخل http { } لود می‌شود — کپی به /etc/nginx/conf.d/vilafarda-http.conf
# gzip on در nginx.conf هست؛ اینجا تکرار نشود.

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/rss+xml
    application/ld+json
    application/manifest+json
    application/xhtml+xml
    application/vnd.ms-fontobject
    font/opentype
    font/ttf
    image/svg+xml
    image/x-icon;

map $http_accept $webp_suffix {
    default "";
    "~*image/webp" ".webp";
}

# کلید خالی = محدود نمی‌شود (کاربر عادی و گوگل)
map $http_user_agent $bad_bot_key {
    default "";
    ~*(?i)(ahrefsbot|semrushbot|dotbot|mj12bot|majestic|screaming.?frog|bytespider|gptbot|ccbot|claudebot|amazonbot|petalbot|dataforseo|serpstat|blexbot|linkdexbot|megaindex|zoominfobot|magpie-crawler|ia_archiver|sogou|seznambot) $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $bad_bot_key zone=badbots:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;
