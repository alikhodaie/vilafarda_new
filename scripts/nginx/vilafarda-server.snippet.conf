# داخل server { } سایت vilafarda — بعد از client_max_body_size

limit_req zone=general burst=80 nodelay;
limit_req zone=badbots burst=4 nodelay;
limit_conn conn_per_ip 40;

# Safari روی iOS اگر بدنه WebP با Content-Type: image/jpeg بیاید عکس را می‌شکند.
# try_files روی $uri.webp نوع MIME را از URL اصلی (.jpg) برمی‌دارد؛ برای sidecar باید rewrite شود.
location ~* ^/files/.+\.(png|jpe?g)$ {
    expires 30d;
    access_log off;
    add_header Vary Accept always;

    error_page 418 = @serve_webp_sidecar;

    if ($webp_suffix = ".webp") {
        if (-f $document_root$uri.webp) {
            return 418;
        }
    }

    try_files $uri =404;
}

location @serve_webp_sidecar {
    rewrite ^(.*)$ $1.webp last;
}

location ~* ^/files/.+\.(png|jpe?g)\.webp$ {
    types { }
    default_type image/webp;
    expires 30d;
    access_log off;
    add_header Vary Accept always;
    try_files $uri =404;
}
